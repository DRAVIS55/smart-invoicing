services:
  web:
    build: .
    ports:
      - "${APP_PORT:-8081}:80"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-invoicer}
      DB_USER: ${DB_USER:-invoicer}
      DB_PASSWORD: ${DB_PASSWORD:-invoicer_secret}
      APP_CURRENCY: ${APP_CURRENCY:-KES}
      APP_STORAGE_PATH: /var/www/private_uploads
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-change-me-now}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
      - uploads_data:/var/www/private_uploads
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-invoicer}
      MYSQL_USER: ${DB_USER:-invoicer}
      MYSQL_PASSWORD: ${DB_PASSWORD:-invoicer_secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
  uploads_data:
